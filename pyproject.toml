[project]
name = "scgpipeline"
version = "0.1.0"
description = "Tugas Akhir S1 RPL Dias"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "selfcheckgpt",
    "torch>=2.6",
    "torchvision>=0.21",
    "torchaudio>=2.6",
    "aiomysql>=0.3.2",
    "bert-score>=0.3.13",
    "celery>=5.6.3",
    "dotenv>=0.9.9",
    "fastapi>=0.135.3",
    "flower>=2.0.1",
    "ipywidgets>=8.1.8",
    "langchain-community>=0.4.1",
    "langchain-ollama>=1.1.0",
    "matplotlib>=3.10.8",
    "mlflow>=3.11.1",
    "pandas>=2.3.3",
    "pymysql>=1.1.3",
    "python-dotenv>=1.2.2",
    "redis>=7.4.0",
    "sentencepiece>=0.2.1",
    "spacy>=3.8.14",
    "sqlalchemy>=2.0.49",
    "tiktoken>=0.12.0",
    "tqdm>=4.66.0",
    "transformers>=5.5.4",
    "uvicorn>=0.44.0",
    "pyjwt>=2.12.1",
    "bcrypt>=5.0.0",
    "python-multipart>=0.0.29",
    "langchain-google-genai>=4.2.4",
    "langchain-fireworks>=1.3.1",
    "langchain-openai>=1.2.2",
    "slowapi>=0.1.9",
    "datasets>=5.0.0",
    "scipy>=1.15.3",
    "scikit-learn>=1.7.2",
    "numpy>=2.2.6",
]

[tool.uv]
index-strategy = "unsafe-best-match"
sources = { torch = { index = "pytorch" }, torchvision = { index = "pytorch" }, torchaudio = { index = "pytorch" }, selfcheckgpt = { path = "./selfcheckgpt", editable = true } }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124" 
explicit = true 
