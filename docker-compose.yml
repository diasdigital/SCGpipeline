services:
    mysql:
        image: mysql:8.4
        container_name: scgpipeline-mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: scgpipeline
            MYSQL_USER: scgp_user
            MYSQL_PASSWORD: scgp_password
            MYSQL_ROOT_PASSWORD: root_password
        ports:
            - '3306:3306'
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD',
                    'mysqladmin',
                    'ping',
                    '-h',
                    'localhost',
                    '-uroot',
                    '-proot_password',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        container_name: scgpipeline-redis
        restart: unless-stopped
        ports:
            - '6379:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 5
        volumes:
            - redis_data:/data

volumes:
    mysql_data:
    redis_data:
